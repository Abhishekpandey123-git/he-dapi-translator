name: guards

# Stage 0 — CI: fast low-RAM guards on every push/PR (no torch, no GPU).
# Staging/production deploys live in cd-staging.yml / cd-production.yml.
on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resource-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light deps (no torch — guards are static + numpy checks)
        run: pip install numpy pillow pyyaml psutil tifffile zarr h5py pytest
      - name: Low-RAM config enforcement
        run: PYTHONPATH=. python -m src.utils.progress_tracker --enforce
      - name: Resource-guard regression tests
        run: PYTHONPATH=. python -m pytest tests/test_resource_guards.py -v
      - name: Backend smoke (import + /health, no model weights needed)
        run: |
          pip install fastapi httpx
          PYTHONPATH=. python -c "from src.backend.main import app; from fastapi.testclient import TestClient; c=TestClient(app); r=c.get('/health'); assert r.status_code==200, r.text; print('HEALTH_OK', r.json())"
