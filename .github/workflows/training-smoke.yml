name: training-smoke

# Heavy, self-contained dummy-training smoke tests (paired + unpaired).
# Manual or weekly only — deliberately NOT on every push (needs CPU torch and builds models).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC

jobs:
  dummy-training:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch + training deps
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pillow pyyaml h5py albumentations pytest
      - name: Dummy training smoke (paired + unpaired)
        run: PYTHONPATH=. python -m pytest tests/test_training_dummy.py -v -m slow
