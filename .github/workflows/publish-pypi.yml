name: publish-pypi

# Manual only (no auto-publish). Uses PyPI Trusted Publishing (OIDC) — no tokens.
# One-time PyPI setup: add pending publishers for
#   owner=urbiologicalpa repo=he-dapi-translator workflow=publish-pypi.yml
#   environments: "pypi" (and "testpypi" for TestPyPI)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheels + sdist
        run: |
          uv build --out-dir dist packages/he-dapi
          uv build --out-dir dist packages/napari-he-dapi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
