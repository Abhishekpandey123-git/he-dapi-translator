[project]
name = "he-dapi-translator"
version = "0.1.0"
description = "Bi-directional H&E <-> DAPI virtual staining: patch + WSI, Docker + napari"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pydantic==2.6.0",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "pytorch-lightning==2.2.0",
    "monai==1.3.0",
    "numpy==1.26.0",
    "pillow==10.3.0",
    "scikit-image==0.22.0",
    "tifffile==2024.5.22",
    "openslide-python==1.3.1",
    "onnx==1.16.0",
    "onnxruntime==1.18.0",
    "h5py",
    "zarr",
    "albumentations",
    "mlflow==2.11.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
wsi = ["large-image[openslide,tiff]"]
lowram = ["psutil"]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
